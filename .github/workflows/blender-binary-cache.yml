name: Blender 4.2 Portable Binary Cache

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/blender-binary-cache.yml'

permissions:
  contents: read

jobs:
  cache-blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Blender 4.2.21 LTS portable archive
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            -o blender-4.2.21-linux-x64.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.21-linux-x64.tar.xz
          sha256sum blender-4.2.21-linux-x64.tar.xz

      - name: Upload portable Blender archive
        uses: actions/upload-artifact@v4
        with:
          name: Blender-4.2.21-Linux-x64
          path: blender-4.2.21-linux-x64.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
