name: Qimir Mask Native Blender Build

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/qimir-mask-ci-test.yml'
      - 'tools/qimir-ci/**'

permissions:
  contents: read

jobs:
  build-mask:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Restore source payload without checking out the large repository
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          mkdir -p qimir_work/package qimir_output
          : > qimir_work/payload.b64
          for part in 00 01 02 03 04 05 06; do
            curl -fL --retry 5 --retry-delay 2 \
              "https://raw.githubusercontent.com/BaRKyy/SWLOR_NWN/${HEAD_SHA}/tools/qimir-ci/payload.${part}" \
              >> qimir_work/payload.b64
          done
          base64 --decode qimir_work/payload.b64 > qimir_work/payload.tar.gz
          echo "750f50a603c3ceb2e2ca2ad91b6d2491397233143e22d020df423367f530c7d1  qimir_work/payload.tar.gz" | sha256sum --check
          tar -xzf qimir_work/payload.tar.gz -C qimir_work/package
          find qimir_work/package -maxdepth 3 -type f -print

      - name: Apply Blender 4.2 compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('qimir_work/package/source/build_qimir_mask.py')
          text = path.read_text(encoding='utf-8')

          old = (
              "    for tri in tessellate_polygon(vectors):\n"
              "        ids = []\n"
              "        for v in tri:\n"
              "            key = (round(v.x, 8), round(v.y, 8))\n"
              "            ids.append(lookup[key][0])\n"
              "        triangles.append(tuple(ids))\n"
          )
          new = (
              "    for tri in tessellate_polygon(vectors):\n"
              "        if tri and isinstance(tri[0], int):\n"
              "            triangles.append(tuple(int(index) for index in tri))\n"
              "            continue\n"
              "        ids = []\n"
              "        for v in tri:\n"
              "            key = (round(v.x, 8), round(v.y, 8))\n"
              "            ids.append(lookup[key][0])\n"
              "        triangles.append(tuple(ids))\n"
          )
          if old not in text:
              raise SystemExit('tessellator compatibility target not found')
          text = text.replace(old, new, 1)

          old_engine = (
              "    available = {item.identifier for item in bpy.types.RenderSettings.bl_rna.properties[\"engine\"].enum_items}\n"
              "    if \"BLENDER_EEVEE_NEXT\" in available:\n"
              "        scene.render.engine = \"BLENDER_EEVEE_NEXT\"\n"
              "    elif \"BLENDER_EEVEE\" in available:\n"
              "        scene.render.engine = \"BLENDER_EEVEE\"\n"
              "    else:\n"
              "        scene.render.engine = \"BLENDER_WORKBENCH\"\n"
          )
          new_engine = (
              "    for engine in (\"BLENDER_EEVEE_NEXT\", \"BLENDER_EEVEE\", \"BLENDER_WORKBENCH\"):\n"
              "        try:\n"
              "            scene.render.engine = engine\n"
              "            break\n"
              "        except Exception:\n"
              "            continue\n"
          )
          if old_engine in text:
              text = text.replace(old_engine, new_engine, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile qimir_work/package/source/build_qimir_mask.py

      - name: Install Python and headless graphics dependencies
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir pillow numpy
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxext6 libxrender1 libxi6 \
            libxkbcommon0 libsm6 libice6

      - name: Generate PBR textures
        env:
          QIMIR_OUTPUT: ${{ github.workspace }}/qimir_output
          QIMIR_TEX_SIZE: '1024'
        run: python3 qimir_work/package/source/generate_textures.py

      - name: Download Blender 4.2 LTS
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            -o qimir_work/blender.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.21-linux-x64.tar.xz
          tar -xf qimir_work/blender.tar.xz -C qimir_work
          qimir_work/blender-4.2.21-linux-x64/blender --version

      - name: Build render and export mask
        env:
          QIMIR_ROOT: ${{ github.workspace }}/qimir_work/package
          QIMIR_OUTPUT: ${{ github.workspace }}/qimir_output
          QIMIR_TEX_SIZE: '1024'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euxo pipefail
          qimir_work/blender-4.2.21-linux-x64/blender \
            --background --factory-startup --python-exit-code 1 \
            --python qimir_work/package/source/build_qimir_mask.py \
            2>&1 | tee qimir_output/blender_build.log

      - name: Assemble optional verification sheets
        if: always()
        continue-on-error: true
        env:
          QIMIR_OUTPUT: ${{ github.workspace }}/qimir_output
        run: python3 qimir_work/package/source/assemble_sheet.py 2>&1 | tee qimir_output/assemble_sheet.log

      - name: Record output inventory
        if: always()
        run: |
          set -euxo pipefail
          find qimir_output -maxdepth 3 -type f -printf '%p %s bytes\n' | sort | tee qimir_output/inventory.txt

      - name: Add editable sources to package
        if: always()
        continue-on-error: true
        run: |
          mkdir -p qimir_output/source
          cp qimir_work/package/source/*.py qimir_output/source/
          cp qimir_work/package/README.md qimir_output/README.md

      - name: Upload native Blender package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Qimir-GTA-Mask-Native-Blender
          path: qimir_output/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
